server {
    listen 80;

    # Defence in depth: emit RELATIVE redirect Locations, never absolute URLs.
    #
    # nginx builds absolute redirects from its OWN listen port (80), so on any
    # deployment that publishes this container on a different host port (the
    # reference compose uses 3000:80) an absolute Location silently drops the port
    # and sends the browser somewhere nothing is listening. A relative Location is
    # resolved by the browser against the URL it is already on, so scheme, host and
    # port are all preserved — correct for http on any port, for https, and behind a
    # TLS-terminating reverse proxy, none of which absolute redirects handle without
    # also tuning port_in_redirect/server_name_in_redirect and trusting
    # X-Forwarded-Proto.
    #
    # The `try_files` below means no redirect should be generated at all now; this
    # keeps any future one (e.g. a newly added real directory) from breaking the same way.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes.
    #
    # NOTE the deliberate absence of a `$uri/` probe. Directory-index probing is
    # meaningless for a SPA, and it actively breaks any route whose name matches a
    # real directory in the build output. Concretely: the /assets route collides
    # with the Vite build's own assets/ directory (which holds the hashed JS/CSS).
    # With `$uri/` in the list, a request for /assets matched that directory, so
    # nginx 301'd to /assets/ and then — finding no index.html inside — returned
    # 403 Forbidden, making the Assets page unreachable. (Before
    # `absolute_redirect off` above, that 301 also dropped the published port, so
    # the browser hung on a dead address instead.)
    #
    # Without `$uri/`: /assets and /assets/ both fall through to /index.html and the
    # SPA routes client-side, while real files under /assets/ still match `$uri` and
    # are served directly. Verified against this image on 2026-09-02 — /assets,
    # /assets/, /navigator all 200 with the SPA, /assets/index-*.js 200 with the asset.
    location / {
        try_files $uri /index.html;
    }

    # Reverse-proxy API calls to the api container, stripping /api prefix
    # (matches Vite dev proxy: path.replace(/^\/api/, ''))
    location /api/ {
        # Re-resolve the `api` hostname per request rather than once at startup.
        #
        # nginx resolves a hostname in a literal proxy_pass exactly once, when the
        # config loads, and then caches that address for the life of the worker. So
        # restarting the api container — which gives it a new Docker IP — leaves this
        # proxy pointed at a dead address and every /api/ call returns 502 until the
        # ui container is ALSO restarted. That failure mode is nasty because the SPA
        # itself still loads fine: the UI just renders "0 assets", an empty group
        # tree and "no evaluations found", which reads as missing data rather than a
        # broken proxy. (Observed 2026-09-02: a DB import stops/starts api, and the
        # UI stayed empty until the ui container was restarted.)
        #
        # Putting the upstream in a variable defers resolution to request time, so an
        # api restart heals itself within `valid`. The explicit rewrite is required
        # because variable-form proxy_pass does not perform the prefix-stripping that
        # the trailing slash in `proxy_pass http://api:8080/` used to provide.
        # 127.0.0.11 is Docker's embedded DNS; ipv6=off avoids AAAA lookups that the
        # corporate resolvers behind it REFUSE.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $tropek_api api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$tropek_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
